<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080"><title>ArduinoISP to clip to IR ring: colour-coded harness reference</title><desc>Lantern Ring contributors. CC BY-SA 3.0: https://creativecommons.org/licenses/by-sa/3.0/</desc><rect width="1500" height="1080" fill="#fff"/><text x="35" y="48" font-family="Droid Sans,Arial,sans-serif" font-size="29" fill="#17334c" text-anchor="start">ARDUINO ISP -&gt; PROGRAMMING CLIP -&gt; RING IR PCB</text><text x="35" y="80" font-family="Droid Sans,Arial,sans-serif" font-size="18" fill="#17334c" text-anchor="start">User-reported COM6 harness colours; unchanged ISP-6 pinout. White leads have a dark outline for print.</text><rect x="35" y="100" width="250" height="44" rx="5" fill="#17334c"/><text x="47" y="129" font-family="Droid Sans,Arial,sans-serif" font-size="17" fill="#fff" text-anchor="start">ARDUINO UNO / HOST</text><rect x="460" y="100" width="240" height="44" rx="5" fill="#17334c"/><text x="472" y="129" font-family="Droid Sans,Arial,sans-serif" font-size="17" fill="#fff" text-anchor="start">PROBE J1 / ISP-6</text><rect x="855" y="100" width="265" height="44" rx="5" fill="#17334c"/><text x="867" y="129" font-family="Droid Sans,Arial,sans-serif" font-size="17" fill="#fff" text-anchor="start">CLIP CONTACT PATH</text><rect x="1215" y="100" width="250" height="44" rx="5" fill="#17334c"/><text x="1227" y="129" font-family="Droid Sans,Arial,sans-serif" font-size="17" fill="#fff" text-anchor="start">RING IR / TARGET</text><rect x="30" y="154" width="1440" height="54" rx="5" fill="#f3f6f8"/><text x="45" y="185" font-family="Droid Sans,Arial,sans-serif" font-size="22" fill="#17334c" text-anchor="start">D12</text><polyline points="290,179 445,179" fill="none" stroke="#707070" stroke-width="6"/><text x="365" y="169" font-family="Droid Sans,Arial,sans-serif" font-size="14" fill="#707070" text-anchor="middle">GREY</text><text x="475" y="185" font-family="Droid Sans,Arial,sans-serif" font-size="23" fill="#17334c" text-anchor="start">1  MISO</text><polyline points="710,179 840,179" fill="none" stroke="#707070" stroke-width="6"/><text x="870" y="185" font-family="Droid Sans,Arial,sans-serif" font-size="20" fill="#17334c" text-anchor="start">P2 pogo</text><polyline points="1125,179 1200,179" fill="none" stroke="#707070" stroke-width="4"/><text x="1230" y="185" font-family="Droid Sans,Arial,sans-serif" font-size="22" fill="#17334c" text-anchor="start">TP2 / PB1</text><rect x="30" y="219" width="1440" height="54" rx="5" fill="#f3f6f8"/><text x="45" y="250" font-family="Droid Sans,Arial,sans-serif" font-size="22" fill="#17334c" text-anchor="start">5V *</text><polyline points="290,244 445,244" fill="none" stroke="#607080" stroke-width="8"/><polyline points="290,244 445,244" fill="none" stroke="#ffffff" stroke-width="6"/><text x="365" y="234" font-family="Droid Sans,Arial,sans-serif" font-size="14" fill="#455466" text-anchor="middle">WHITE</text><text x="475" y="250" font-family="Droid Sans,Arial,sans-serif" font-size="23" fill="#17334c" text-anchor="start">2  VCC</text><polyline points="710,244 840,244" fill="none" stroke="#607080" stroke-width="8"/><polyline points="710,244 840,244" fill="none" stroke="#ffffff" stroke-width="6"/><text x="870" y="250" font-family="Droid Sans,Arial,sans-serif" font-size="20" fill="#17334c" text-anchor="start">P9 pogo</text><polyline points="1125,244 1200,244" fill="none" stroke="#607080" stroke-width="6"/><polyline points="1125,244 1200,244" fill="none" stroke="#ffffff" stroke-width="4"/><text x="1230" y="250" font-family="Droid Sans,Arial,sans-serif" font-size="22" fill="#17334c" text-anchor="start">TP9 / VCC</text><rect x="30" y="284" width="1440" height="54" rx="5" fill="#f3f6f8"/><text x="45" y="315" font-family="Droid Sans,Arial,sans-serif" font-size="22" fill="#17334c" text-anchor="start">D13</text><polyline points="290,309 445,309" fill="none" stroke="#1768c4" stroke-width="6"/><text x="365" y="299" font-family="Droid Sans,Arial,sans-serif" font-size="14" fill="#1768c4" text-anchor="middle">BLUE</text><text x="475" y="315" font-family="Droid Sans,Arial,sans-serif" font-size="23" fill="#17334c" text-anchor="start">3  SCK</text><polyline points="710,309 840,309" fill="none" stroke="#1768c4" stroke-width="6"/><text x="870" y="315" font-family="Droid Sans,Arial,sans-serif" font-size="20" fill="#17334c" text-anchor="start">P3 pogo</text><polyline points="1125,309 1200,309" fill="none" stroke="#1768c4" stroke-width="4"/><text x="1230" y="315" font-family="Droid Sans,Arial,sans-serif" font-size="22" fill="#17334c" text-anchor="start">TP3 / PB2</text><rect x="30" y="349" width="1440" height="54" rx="5" fill="#f3f6f8"/><text x="45" y="380" font-family="Droid Sans,Arial,sans-serif" font-size="22" fill="#17334c" text-anchor="start">D11</text><polyline points="290,374 445,374" fill="none" stroke="#7b3fb3" stroke-width="6"/><text x="365" y="364" font-family="Droid Sans,Arial,sans-serif" font-size="14" fill="#7b3fb3" text-anchor="middle">PURPLE</text><text x="475" y="380" font-family="Droid Sans,Arial,sans-serif" font-size="23" fill="#17334c" text-anchor="start">4  MOSI</text><polyline points="710,374 840,374" fill="none" stroke="#7b3fb3" stroke-width="6"/><text x="870" y="380" font-family="Droid Sans,Arial,sans-serif" font-size="20" fill="#17334c" text-anchor="start">P1 pogo</text><polyline points="1125,374 1200,374" fill="none" stroke="#7b3fb3" stroke-width="4"/><text x="1230" y="380" font-family="Droid Sans,Arial,sans-serif" font-size="22" fill="#17334c" text-anchor="start">TP1 / PB0</text><rect x="30" y="414" width="1440" height="54" rx="5" fill="#f3f6f8"/><text x="45" y="445" font-family="Droid Sans,Arial,sans-serif" font-size="22" fill="#17334c" text-anchor="start">D10</text><polyline points="290,439 445,439" fill="none" stroke="#8c564b" stroke-width="6"/><text x="365" y="429" font-family="Droid Sans,Arial,sans-serif" font-size="14" fill="#8c564b" text-anchor="middle">BROWN</text><text x="475" y="445" font-family="Droid Sans,Arial,sans-serif" font-size="23" fill="#17334c" text-anchor="start">5  RESET</text><polyline points="710,439 840,439" fill="none" stroke="#8c564b" stroke-width="6"/><text x="870" y="445" font-family="Droid Sans,Arial,sans-serif" font-size="20" fill="#17334c" text-anchor="start">P6 pogo</text><polyline points="1125,439 1200,439" fill="none" stroke="#8c564b" stroke-width="4"/><text x="1230" y="445" font-family="Droid Sans,Arial,sans-serif" font-size="22" fill="#17334c" text-anchor="start">TP6 / PB5</text><rect x="30" y="479" width="1440" height="54" rx="5" fill="#f3f6f8"/><text x="45" y="510" font-family="Droid Sans,Arial,sans-serif" font-size="22" fill="#17334c" text-anchor="start">GND</text><polyline points="290,504 445,504" fill="none" stroke="#202020" stroke-width="6"/><text x="365" y="494" font-family="Droid Sans,Arial,sans-serif" font-size="14" fill="#202020" text-anchor="middle">BLACK</text><text x="475" y="510" font-family="Droid Sans,Arial,sans-serif" font-size="23" fill="#17334c" text-anchor="start">6  GND</text><polyline points="710,504 840,504" fill="none" stroke="#202020" stroke-width="6"/><text x="870" y="510" font-family="Droid Sans,Arial,sans-serif" font-size="20" fill="#17334c" text-anchor="start">J2 -&gt; wire -&gt; anvil</text><polyline points="1125,504 1200,504" fill="none" stroke="#202020" stroke-width="4"/><text x="1230" y="510" font-family="Droid Sans,Arial,sans-serif" font-size="22" fill="#17334c" text-anchor="start">TP8 / GND</text><text x="35" y="600" font-family="Droid Sans,Arial,sans-serif" font-size="22" fill="#17334c" text-anchor="start">J1: TOP VIEW of the populated probe</text><text x="35" y="630" font-family="Droid Sans,Arial,sans-serif" font-size="16" fill="#17334c" text-anchor="start">Extended front/header edge is above; pogo grid and jaw slots below.</text><rect x="35" y="712" width="150" height="48" rx="5" fill="#707070" stroke="#607080"/><text x="110" y="742" font-family="Droid Sans,Arial,sans-serif" font-size="20" fill="#fff" text-anchor="middle">1 MISO</text><rect x="35" y="650" width="150" height="48" rx="5" fill="#ffffff" stroke="#607080"/><text x="110" y="680" font-family="Droid Sans,Arial,sans-serif" font-size="20" fill="#17334c" text-anchor="middle">2 VCC</text><rect x="205" y="712" width="150" height="48" rx="5" fill="#1768c4" stroke="#607080"/><text x="280" y="742" font-family="Droid Sans,Arial,sans-serif" font-size="20" fill="#fff" text-anchor="middle">3 SCK</text><rect x="205" y="650" width="150" height="48" rx="5" fill="#7b3fb3" stroke="#607080"/><text x="280" y="680" font-family="Droid Sans,Arial,sans-serif" font-size="20" fill="#fff" text-anchor="middle">4 MOSI</text><rect x="375" y="712" width="150" height="48" rx="5" fill="#8c564b" stroke="#607080"/><text x="450" y="742" font-family="Droid Sans,Arial,sans-serif" font-size="20" fill="#fff" text-anchor="middle">5 RESET</text><rect x="375" y="650" width="150" height="48" rx="5" fill="#202020" stroke="#607080"/><text x="450" y="680" font-family="Droid Sans,Arial,sans-serif" font-size="20" fill="#fff" text-anchor="middle">6 GND</text><text x="35" y="790" font-family="Droid Sans,Arial,sans-serif" font-size="16" fill="#17334c" text-anchor="start">Confirm pin 1 on silk. Cable mating-face view is mirrored.</text><text x="650" y="605" font-family="Droid Sans,Arial,sans-serif" font-size="22" fill="#17334c" text-anchor="start">BLACK ground-return lead inside the clip</text><text x="650" y="637" font-family="Droid Sans,Arial,sans-serif" font-size="18" fill="#17334c" text-anchor="start">J1.6 -&gt; probe J2 -&gt; insulated slack wire -&gt; anvil J1</text><text x="650" y="667" font-family="Droid Sans,Arial,sans-serif" font-size="18" fill="#17334c" text-anchor="start">-&gt; P8 (earlier) or P8L + P8R (v0.2) -&gt; FRONT TP8.</text><text x="650" y="705" font-family="Droid Sans,Arial,sans-serif" font-size="18" fill="#17334c" text-anchor="start">Five upper ISP contacts: TP1, TP2, TP3, TP6 and TP9.</text><text x="650" y="735" font-family="Droid Sans,Arial,sans-serif" font-size="18" fill="#17334c" text-anchor="start">TP4/PB3 and TP5/PB4 are spare, NOT extra ISP signals.</text><text x="650" y="773" font-family="Droid Sans,Arial,sans-serif" font-size="18" fill="#17334c" text-anchor="start">D10 goes to TARGET RESET, never to the Uno RESET pin.</text><rect x="25" y="814" width="1450" height="240" rx="8" fill="#fff1e9" stroke="#a62b0d"/><text x="40" y="844" font-family="Droid Sans,Arial,sans-serif" font-size="18" fill="#8c250d" text-anchor="start">REMOVE CR2032. Wire and check continuity with all power OFF.</text><text x="40" y="875" font-family="Droid Sans,Arial,sans-serif" font-size="18" fill="#8c250d" text-anchor="start">* White lead = Uno 5V to J1.2; black = common GND. Use ONE supply, never join outputs.</text><text x="40" y="906" font-family="Droid Sans,Arial,sans-serif" font-size="18" fill="#8c250d" text-anchor="start">The 5V target rail is user-reported working; target power now matches Uno 5V ISP signals.</text><text x="40" y="937" font-family="Droid Sans,Arial,sans-serif" font-size="18" fill="#8c250d" text-anchor="start">Measure power at the PCB and check current/temperature; practical operation is not full qualification.</text><text x="40" y="968" font-family="Droid Sans,Arial,sans-serif" font-size="18" fill="#8c250d" text-anchor="start">For a 3.3V target use level translation or a compatible ISP host; Uno 3V3 does not change its 5V I/O.</text><text x="40" y="999" font-family="Droid Sans,Arial,sans-serif" font-size="18" fill="#8c250d" text-anchor="start">Programming and full readback passed on 10 Nov 2026; IR operation remains untested.</text></svg>